# CI — 토큰/팔레트 검증 + 예시 페이지 렌더 테스트
# 사내 파이프라인(Jenkins/GitLab 등)으로 옮길 때는 steps의 npm 명령 4개만 그대로 옮기면 된다.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 토큰 JSON이 CSS와 일치하는지
        run: npm run tokens && git diff --exit-code -- tokens/tokens.json
      - name: 차트 팔레트 색약 안전성 (light + dark)
        run: npm run validate:palette
      - name: 외부 라이브러리 vendor 복사
        run: npm run vendor
      - name: api/ 생성 (매니페스트·카탈로그·번들)
        run: npm run api && node -e "new Function(require('fs').readFileSync('api/dist/ds.js','utf8'))" && sh -n api/install.sh
      - name: Playwright 설치
        run: npm i -D --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: 예시 페이지 렌더 (콘솔 에러·가로 스크롤 검사 + 스크린샷)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/__screens__/
          retention-days: 14
