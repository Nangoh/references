<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 · references</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ds.css">
<script src="../js/ds-theme.js"></script>
<style>
  /* 문서 본문 — 토큰만 사용. 읽기 폭 72ch, 표·코드는 가로 스크롤 */
  .doc { max-width: 880px; }
  .doc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .doc-head .ds-breadcrumb { margin-bottom: var(--sp-2); }
  .doc-src { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-muted); }
  .md { font-size: var(--text-md); line-height: 1.7; color: var(--fg); }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: var(--text-2xl); line-height: var(--lh-2xl); font-weight: var(--weight-semibold); margin: 0 0 var(--sp-4); letter-spacing: -0.01em; text-wrap: balance; }
  .md h2 { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: var(--weight-semibold); margin: var(--sp-10) 0 var(--sp-3); padding-top: var(--sp-4); border-top: 1px solid var(--border); scroll-margin-top: calc(var(--shell-h) + var(--sp-4)); }
  .md h3 { font-size: var(--text-lg); line-height: var(--lh-lg); font-weight: var(--weight-semibold); margin: var(--sp-6) 0 var(--sp-2); scroll-margin-top: calc(var(--shell-h) + var(--sp-4)); }
  .md h4 { font-size: var(--text-md); font-weight: var(--weight-semibold); margin: var(--sp-4) 0 var(--sp-1); }
  .md p { margin: 0 0 var(--sp-3); max-width: 72ch; }
  .md ul, .md ol { margin: 0 0 var(--sp-3); padding-left: 1.4em; max-width: 72ch; }
  .md li { margin: 2px 0; }
  .md li > ul, .md li > ol { margin-bottom: 0; }
  .md a { color: var(--link); }
  .md strong { font-weight: var(--weight-semibold); }
  .md code { font-family: var(--font-mono); font-size: 0.92em; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 1px 5px; }
  .md pre { margin: 0 0 var(--sp-4); padding: var(--sp-3) var(--sp-4); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); overflow-x: auto; font-size: var(--text-sm); line-height: 1.55; }
  .md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
  .md blockquote { margin: 0 0 var(--sp-3); padding: var(--sp-2) var(--sp-4); border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--fg-2); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: var(--sp-6) 0; }
  .md .tbl { overflow-x: auto; margin: 0 0 var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-md); }
  .md table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .md th { text-align: left; background: var(--surface-2); color: var(--fg-muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-label); font-weight: var(--weight-semibold); padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .md td { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }
  .md input[type=checkbox] { margin-right: 6px; accent-color: var(--accent); }
  .md img { max-width: 100%; }
  .doc-nav { display: flex; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-10); padding-top: var(--sp-4); border-top: 1px solid var(--border); }
  .doc-nav a { max-width: 48%; }
  .doc-nav .ds-caption { display: block; }
  .doc-empty { padding: var(--sp-10); text-align: center; color: var(--fg-2); }
</style>
</head>
<body>
<div class="ds-shell">
  <header class="ds-shell__header">
    <a class="ds-shell__brand" href="index.html"><span class="ds-shell__mark" aria-hidden="true"></span>references<span class="ds-shell__env">design system</span></a>
    <nav class="ds-shell__crumb" aria-label="현재 위치"><span class="ds-shell__crumb-sep" aria-hidden="true">›</span><a href="index.html">문서</a><span class="ds-shell__crumb-sep" aria-hidden="true">›</span><span aria-current="page" id="crumb-title">…</span></nav>
    <nav class="ds-shell__nav" aria-label="레퍼런스 메뉴">
      <a href="index.html">홈</a>
      <a href="showcase.html">컴포넌트</a>
      <a href="charts.html">차트</a>
      <a href="dashboard.html">대시보드</a>
      <a href="explorer.html">탐색기</a>
      <a href="drilldown.html">드릴다운</a>
    </nav>
    <span class="ds-shell__spacer"></span>
    <div class="ds-shell__actions">
      <a class="ds-btn ds-btn--sm" id="btn-github" href="https://github.com/Nangoh/references" target="_blank" rel="noopener">GitHub에서 편집</a>
      <button class="ds-btn ds-btn--sm ds-btn--icon ds-theme-toggle" type="button" aria-label="테마 전환">
        <svg class="ds-icon ds-icon--moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ds-icon ds-icon--sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <aside class="ds-sidebar" data-sitenav="manual"></aside>
  <main class="ds-main">
    <article class="doc">
      <div class="doc-head">
        <div>
          <nav class="ds-breadcrumb" aria-label="문서 경로"><a href="index.html">references</a><span class="ds-breadcrumb__sep">›</span><span id="crumb-group">문서</span><span class="ds-breadcrumb__sep">›</span><span aria-current="page" id="crumb-doc">…</span></nav>
          <div class="doc-src" id="doc-src"></div>
        </div>
      </div>
      <div class="md" id="md"><div class="doc-empty">불러오는 중…</div></div>
      <nav class="doc-nav" id="doc-nav" aria-label="이전 · 다음 문서"></nav>
    </article>
  </main>
</div>
<script src="../vendor/marked/marked.umd.js"></script>
<script src="../js/ds-sitenav.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const DOCS = DSSiteNav.docs();                       // 사이트맵에 등록된 문서 (id → 경로)
  let file = params.get('f') || 'docs/README.md';
  if (!/^(docs\/[\w.-]+\.md|AGENTS\.md|README\.md|prompts\/[\w.-]+\.md)$/.test(file)) file = 'docs/README.md';   // 리포 안 .md 만
  const entry = DOCS.find(d => d.doc === file);
  const title = entry ? entry.title : file.split('/').pop().replace(/\.md$/, '');
  document.title = title + ' · references';
  document.getElementById('crumb-title').textContent = title;
  document.getElementById('crumb-doc').textContent = title;
  document.getElementById('crumb-group').textContent = entry ? entry.group : '문서';
  document.getElementById('doc-src').textContent = file;
  document.getElementById('btn-github').href = 'https://github.com/Nangoh/references/blob/main/' + file;

  const md = document.getElementById('md');
  let text = '';
  try { const r = await fetch('../' + file, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status + ' ' + r.statusText); text = await r.text(); }
  catch (e) { md.innerHTML = ''; const d = document.createElement('div'); d.className = 'doc-empty'; d.textContent = '문서를 불러오지 못했습니다 (' + e.message + '). http 로 열어야 합니다: npm run serve'; md.appendChild(d); DSSiteNav.mount(document.querySelector('[data-sitenav]'), entry ? entry.id : 'docs'); return; }

  // 렌더: 제목에 id, 상대 .md 링크 → doc.html, 표는 가로 스크롤 래퍼
  const slugCount = {};
  const slug = s => { const base = s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'h'; slugCount[base] = (slugCount[base] || 0) + 1; return slugCount[base] > 1 ? base + '-' + slugCount[base] : base; };
  const renderer = new marked.Renderer();
  const base = file.includes('/') ? file.slice(0, file.lastIndexOf('/') + 1) : '';
  renderer.heading = function ({ tokens, depth }) { const t = this.parser.parseInline(tokens); const plain = t.replace(/<[^>]+>/g, ''); return `<h${depth} id="${slug(plain)}">${t}</h${depth}>`; };
  renderer.link = function ({ href, title, tokens }) {
    const t = this.parser.parseInline(tokens);
    let h = href || '';
    if (/^(https?:)?\/\//.test(h) || h.startsWith('#') || h.startsWith('mailto:')) return `<a href="${h}"${/^https?:/.test(h) ? ' target="_blank" rel="noopener"' : ''}${title ? ` title="${title}"` : ''}>${t}</a>`;
    // 리포 상대 경로 → 사이트 경로. .md 는 뷰어로, 그 외는 파일 그대로
    const parts = (base + h).split('/'); const st = []; for (const p of parts) { if (p === '..') st.pop(); else if (p !== '.' && p !== '') st.push(p); } const abs = st.join('/');
    const [pth, hash] = abs.split('#');
    if (/\.md$/.test(pth)) return `<a href="doc.html?f=${encodeURIComponent(pth)}${hash ? '#' + hash : ''}">${t}</a>`;
    return `<a href="../${abs}">${t}</a>`;
  };
  renderer.table = function (tok) { const html = marked.Renderer.prototype.table.call(this, tok); return `<div class="tbl">${html}</div>`; };
  marked.use({ renderer, gfm: true, breaks: false });
  md.innerHTML = marked.parse(text);
  // 체크박스는 읽기 전용 표시로
  md.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.disabled = true; });

  // 사이드바: 현재 문서 + 이 문서의 h2 목차
  const sections = Array.from(md.querySelectorAll('h2[id]')).map(h => [h.id, h.textContent.trim()]);
  DSSiteNav.mount(document.querySelector('[data-sitenav]'), entry ? entry.id : 'docs', { sections });
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }

  // 이전 · 다음
  const nav = document.getElementById('doc-nav');
  const i = DOCS.findIndex(d => d.doc === file); const prev = DOCS[i - 1], next = DOCS[i + 1];
  const mk = (d, label) => { if (!d) { const s = document.createElement('span'); return s; } const a = document.createElement('a'); a.className = 'ds-btn'; a.href = 'doc.html?f=' + encodeURIComponent(d.doc); a.textContent = `${label} ${d.title}`; return a; };
  nav.appendChild(mk(prev, '←')); nav.appendChild(mk(next, '→'));
})();
</script>
</body>
</html>
